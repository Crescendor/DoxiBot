<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Tumble Slot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        body {
            background: transparent;
            font-family: 'Outfit', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slot-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 680px;
            animation: containerAppear 0.5s ease;
        }

        .slot-container.visible {
            display: flex;
        }

        .slot-container.hiding {
            animation: containerDisappear 0.4s ease-in forwards;
        }

        @keyframes containerAppear {
            from {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes containerDisappear {
            to {
                transform: scale(0.9) translateY(-20px);
                opacity: 0;
            }
        }

        .game-title-banner {
            background: linear-gradient(135deg, #1a237e, #4a148c, #1a237e);
            padding: 10px 40px;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 5px 25px rgba(74, 20, 140, 0.4);
        }

        .game-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ffd700;
            letter-spacing: 2px;
        }

        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 16px;
            background: linear-gradient(180deg, #1a237e, #0d1442);
            border: 2px solid #3949ab;
        }

        .player-name {
            font-size: 16px;
            color: #ffd700;
            font-weight: 600;
        }

        .bet-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-box {
            background: linear-gradient(135deg, #283593, #1a237e);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            border: 1px solid #3f51b5;
        }

        .spin-counter {
            color: #00e5ff;
        }

        .tumble-mult {
            color: #ff4081;
            font-weight: 700;
        }

        .bet-amount {
            color: #ffd700;
        }

        .slot-frame {
            background: linear-gradient(180deg, #0d1442, #050820);
            border: 3px solid #3949ab;
            border-top: none;
            padding: 10px;
            position: relative;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(6, 70px);
            grid-template-rows: repeat(5, 70px);
            gap: 4px;
            background: linear-gradient(180deg, #0a0f30, #050820);
            padding: 5px;
            border-radius: 10px;
        }

        .slot-cell {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #1a237e, #0d1442);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            border: 2px solid #3949ab;
            position: relative;
            transition: all 0.2s ease;
        }

        .slot-cell img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .slot-cell.winning {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
            animation: winGlow 0.3s ease infinite alternate;
        }

        @keyframes winGlow {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }
        }

        .slot-cell.removing {
            animation: removeSymbol 0.25s ease forwards;
        }

        @keyframes removeSymbol {
            to {
                transform: scale(0);
                opacity: 0;
            }
        }

        .slot-cell.dropping {
            animation: dropSymbol 0.25s ease;
        }

        @keyframes dropSymbol {
            from {
                transform: translateY(-70px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .multiplier-orb {
            position: absolute;
            top: 2px;
            right: 2px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 8px;
            animation: orbPulse 0.3s ease infinite alternate;
            z-index: 10;
        }

        @keyframes orbPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        .win-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 25px #ffd700;
            z-index: 100;
            display: none;
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #0d1442, #050820);
            border-radius: 0 0 15px 15px;
            border: 3px solid #3949ab;
            border-top: none;
        }

        .total-win {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .coin-name {
            color: #7986cb;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="slot-container" class="slot-container">
        <div class="game-title-banner">
            <div id="game-title" class="game-title">10 TUMBLE SLOT</div>
        </div>

        <div class="player-bar">
            <span id="player-name" class="player-name">@Oyuncu</span>
            <div class="bet-info">
                <span class="info-box spin-counter">🎰 <span id="current-spin">1</span>/<span
                        id="total-spins">10</span></span>
                <span class="info-box tumble-mult">⚡ <span id="tumble-mult">1</span>x</span>
                <span class="info-box bet-amount">🎫 <span id="bet-amount">0</span></span>
            </div>
        </div>

        <div class="slot-frame">
            <div id="slot-grid" class="slot-grid"></div>
            <div id="win-popup" class="win-popup"></div>
        </div>

        <div class="bottom-bar">
            <span id="total-win" class="total-win"></span>
            <span id="coin-name" class="coin-name"></span>
        </div>
    </div>

    <script>
        const DEFAULT_ICONS = ['👑', '💎', '🍀', '⭐', '🔔', '🍊', '🍇', '🍋', '🍒', '🫐'];
        let currentGameData = null;
        let pollInterval = null;
        let icons = DEFAULT_ICONS;
        let isAnimating = false;

        const pathParts = window.location.pathname.split('/');
        const channelSlug = pathParts[1];

        function renderIcon(icon) {
            if (icon && (icon.startsWith('http://') || icon.startsWith('https://'))) {
                return `<img src="${icon}" alt="icon">`;
            }
            return icon || '❓';
        }

        function createGrid(gridData) {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const cell = document.createElement('div');
                cell.className = 'slot-cell';
                cell.id = `cell-${i}`;
                cell.innerHTML = renderIcon(gridData ? gridData[i] : icons[Math.floor(Math.random() * icons.length)]);
                grid.appendChild(cell);
            }
        }

        function highlightWinningCells(positions) {
            document.querySelectorAll('.slot-cell').forEach(cell => cell.classList.remove('winning'));
            positions.forEach(pos => {
                const cell = document.getElementById(`cell-${pos}`);
                if (cell) cell.classList.add('winning');
            });
        }

        function showMultipliers(multipliers) {
            document.querySelectorAll('.multiplier-orb').forEach(orb => orb.remove());
            multipliers.forEach(mult => {
                const cell = document.getElementById(`cell-${mult.position}`);
                if (cell) {
                    const orb = document.createElement('div');
                    orb.className = 'multiplier-orb';
                    orb.textContent = `${mult.value}x`;
                    cell.appendChild(orb);
                }
            });
        }

        async function animateRemove(positions) {
            positions.forEach(pos => {
                const cell = document.getElementById(`cell-${pos}`);
                if (cell) cell.classList.add('removing');
            });
            await new Promise(r => setTimeout(r, 250));
        }

        function showWinPopup(amount) {
            const popup = document.getElementById('win-popup');
            popup.textContent = `+${amount.toLocaleString()}`;
            popup.style.display = 'block';
            setTimeout(() => popup.style.display = 'none', 600);
        }

        function hideOverlay() {
            const container = document.getElementById('slot-container');
            container.classList.add('hiding');
            setTimeout(() => {
                container.classList.remove('visible', 'hiding');
                currentGameData = null;
            }, 400);
        }

        // Animate a single tumble
        async function animateTumble(tumble, coinName) {
            createGrid(tumble.grid);

            // Update tumble multiplier display
            document.getElementById('tumble-mult').textContent = tumble.tumble_multiplier || 1;

            await new Promise(r => setTimeout(r, 150));

            if (tumble.wins && tumble.wins.length > 0) {
                const allPositions = [];
                tumble.wins.forEach(w => allPositions.push(...w.positions));
                highlightWinningCells([...new Set(allPositions)]);

                if (tumble.multipliers && tumble.multipliers.length > 0) {
                    showMultipliers(tumble.multipliers);
                }

                await new Promise(r => setTimeout(r, 350));

                // Show tumble win
                if (tumble.tumble_win > 0) {
                    showWinPopup(tumble.tumble_win);
                }

                if (!tumble.is_final && tumble.removed_positions.length > 0) {
                    await animateRemove(tumble.removed_positions);
                }
            }

            await new Promise(r => setTimeout(r, 100));
        }

        // Animate a single spin (all its tumbles)
        async function animateSpin(spin, spinIndex, totalSpins, coinName) {
            document.getElementById('current-spin').textContent = spinIndex + 1;
            document.getElementById('total-spins').textContent = totalSpins;
            document.getElementById('tumble-mult').textContent = '1';

            for (const tumble of spin.tumbles) {
                await animateTumble(tumble, coinName);
            }
        }

        async function runGame(gameData, settings) {
            isAnimating = true;
            const result = gameData.result;
            const spins = result.spins || [];
            const grandTotalWin = result.grand_total_win || 0;
            const coinName = settings?.coin_name || 'Coin';

            document.getElementById('total-win').textContent = '';
            document.getElementById('coin-name').textContent = '';

            let runningTotal = 0;

            for (let i = 0; i < spins.length; i++) {
                const spin = spins[i];
                await animateSpin(spin, i, spins.length, coinName);

                runningTotal += spin.spin_win || 0;
                if (runningTotal > 0) {
                    document.getElementById('total-win').textContent = `+${runningTotal.toLocaleString()}`;
                    document.getElementById('coin-name').textContent = coinName;
                }

                await new Promise(r => setTimeout(r, 200));
            }

            // Final display
            if (grandTotalWin > 0) {
                document.getElementById('total-win').textContent = `+${grandTotalWin.toLocaleString()}`;
            } else {
                document.getElementById('total-win').textContent = '0';
            }
            document.getElementById('coin-name').textContent = coinName;

            await new Promise(r => setTimeout(r, 2000));
            hideOverlay();
            isAnimating = false;
        }

        async function pollState() {
            try {
                const res = await fetch(`/api/channel/${channelSlug}/slot/state`);
                const data = await res.json();
                const container = document.getElementById('slot-container');

                if (data.active && data.game && !isAnimating && !currentGameData) {
                    currentGameData = data.game;

                    if (data.settings?.icons) {
                        icons = typeof data.settings.icons === 'string'
                            ? JSON.parse(data.settings.icons)
                            : data.settings.icons;
                    }

                    if (data.settings?.game_name) {
                        document.getElementById('game-title').textContent = data.settings.game_name.toUpperCase();
                    }

                    container.classList.remove('hiding');
                    container.classList.add('visible');
                    createGrid();

                    document.getElementById('player-name').textContent = `@${data.game.username}`;
                    document.getElementById('bet-amount').textContent = data.game.bet_amount.toLocaleString();
                    document.getElementById('current-spin').textContent = '1';
                    document.getElementById('total-spins').textContent = data.game.total_spins || '10';
                    document.getElementById('tumble-mult').textContent = '1';
                    document.getElementById('total-win').textContent = '';
                    document.getElementById('coin-name').textContent = '';

                    if (data.game.result) {
                        runGame(data.game, data.settings);
                    }
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        createGrid();
        pollState();
        pollInterval = setInterval(pollState, 500);
    </script>
</body>

</html>
