<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        body {
            background: transparent;
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slot-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 580px;
            animation: containerAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .slot-container.visible {
            display: flex;
        }

        .slot-container.hiding {
            animation: containerDisappear 0.5s ease-in forwards;
        }

        @keyframes containerAppear {
            from {
                transform: scale(0.7) translateY(50px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes containerDisappear {
            to {
                transform: scale(0.8) translateY(-30px);
                opacity: 0;
            }
        }

        .game-title-banner {
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            padding: 12px 50px;
            border-radius: 30px 30px 0 0;
            z-index: 10;
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.5);
        }

        .game-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a0a00;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
        }

        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            background: linear-gradient(180deg, #2a1a4a, #1a0a2a);
            border: 2px solid #6a3a9a;
        }

        .player-name {
            font-size: 18px;
            color: #00d9ff;
            font-weight: 600;
        }

        .bet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bet-amount {
            background: linear-gradient(135deg, #4a2a7a, #3a1a5a);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            color: #ffd700;
            border: 1px solid #8a5aba;
        }

        .spin-counter {
            background: linear-gradient(135deg, #2a5a4a, #1a3a2a);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            color: #00ff88;
            border: 1px solid #4a8a6a;
        }

        .slot-frame {
            background: linear-gradient(180deg, #1e0a3e, #0a0020);
            border: 4px solid #6a3a9a;
            border-top: none;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .slot-grid-wrapper {
            position: relative;
            width: 490px;
            height: 392px;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 90px);
            grid-template-rows: repeat(4, 90px);
            gap: 8px;
            background: linear-gradient(180deg, #0d0020, #050010);
            padding: 8px;
            border-radius: 15px;
            position: relative;
        }

        #line-canvas {
            position: absolute;
            top: 8px;
            left: 8px;
            pointer-events: none;
            z-index: 50;
        }

        .slot-cell {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #2a1a4a, #1a0a3a);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            border: 3px solid #4a2a7a;
            box-shadow: inset 0 -5px 15px rgba(0, 0, 0, 0.5);
            position: relative;
            transition: all 0.3s ease;
        }

        .slot-cell img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .slot-cell.spinning {
            animation: symbolDrop 0.1s linear infinite;
        }

        @keyframes symbolDrop {
            0% {
                transform: translateY(-15px);
                opacity: 0.5;
            }

            100% {
                transform: translateY(15px);
                opacity: 1;
            }
        }

        .slot-cell.winner {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: winPulse 0.5s ease infinite alternate;
            z-index: 60;
        }

        @keyframes winPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }

        .line-info {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
            white-space: nowrap;
            animation: lineInfoAppear 0.4s ease;
        }

        @keyframes lineInfoAppear {
            from {
                transform: translateX(-50%) scale(0.5);
                opacity: 0;
            }

            to {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, #1a0a2a, #0a0015);
            border-radius: 0 0 20px 20px;
            border: 4px solid #6a3a9a;
            border-top: none;
            margin-top: 40px;
        }

        .total-win {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .coin-name {
            color: #a080c0;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <div id="slot-container" class="slot-container">
        <div class="game-title-banner">
            <div id="game-title" class="game-title">SLOT MAKİNESİ</div>
        </div>

        <div class="player-bar">
            <span id="player-name" class="player-name">@Oyuncu</span>
            <div class="bet-info">
                <span class="spin-counter">🎰 <span id="current-spin">1</span>/<span id="total-spins">5</span></span>
                <span class="bet-amount">🎫 <span id="bet-amount">0</span></span>
            </div>
        </div>

        <div class="slot-frame">
            <div class="slot-grid-wrapper">
                <div id="slot-grid" class="slot-grid"></div>
                <canvas id="line-canvas" width="474" height="376"></canvas>
            </div>
            <div id="line-info" class="line-info" style="display: none;"></div>
        </div>

        <div class="bottom-bar">
            <span id="total-win" class="total-win"></span>
            <span id="coin-name" class="coin-name"></span>
        </div>
    </div>

    <script>
        const DEFAULT_ICONS = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
        let currentGameData = null;
        let pollInterval = null;
        let icons = DEFAULT_ICONS;
        let isAnimating = false;

        const pathParts = window.location.pathname.split('/');
        const channelSlug = pathParts[1];

        // Cell positions for drawing lines (center of each cell)
        const CELL_SIZE = 90;
        const GAP = 8;
        function getCellCenter(index) {
            const col = index % 5;
            const row = Math.floor(index / 5);
            const x = col * (CELL_SIZE + GAP) + CELL_SIZE / 2;
            const y = row * (CELL_SIZE + GAP) + CELL_SIZE / 2;
            return { x, y };
        }

        function renderIcon(icon) {
            if (icon && (icon.startsWith('http://') || icon.startsWith('https://'))) {
                return `<img src="${icon}" alt="icon">`;
            }
            return icon || '❓';
        }

        function initGrid() {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const cell = document.createElement('div');
                cell.className = 'slot-cell';
                cell.id = `cell-${i}`;
                cell.innerHTML = renderIcon(icons[Math.floor(Math.random() * icons.length)]);
                grid.appendChild(cell);
            }
        }

        function clearCanvas() {
            const canvas = document.getElementById('line-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function drawLine(positions, color) {
            const canvas = document.getElementById('line-canvas');
            const ctx = canvas.getContext('2d');

            ctx.strokeStyle = color;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;

            ctx.beginPath();
            for (let i = 0; i < positions.length; i++) {
                const center = getCellCenter(positions[i]);
                if (i === 0) {
                    ctx.moveTo(center.x, center.y);
                } else {
                    ctx.lineTo(center.x, center.y);
                }
            }
            ctx.stroke();
        }

        function highlightWinningCells(positions) {
            document.querySelectorAll('.slot-cell').forEach(cell => cell.classList.remove('winner'));
            positions.forEach(pos => {
                const cell = document.getElementById(`cell-${pos}`);
                if (cell) cell.classList.add('winner');
            });
        }

        function showLineInfo(lineData, coinName) {
            const info = document.getElementById('line-info');
            info.textContent = `${lineData.symbol} x${lineData.match_count} = +${lineData.win.toLocaleString()} ${coinName}`;
            info.style.display = 'block';
            info.style.color = lineData.color;
            info.style.textShadow = `0 0 15px ${lineData.color}`;
        }

        async function spinAnimation() {
            const cells = document.querySelectorAll('.slot-cell');
            cells.forEach(cell => cell.classList.add('spinning'));

            const spinDuration = 1500;
            const spinStart = Date.now();

            while (Date.now() - spinStart < spinDuration) {
                cells.forEach(cell => {
                    cell.innerHTML = renderIcon(icons[Math.floor(Math.random() * icons.length)]);
                });
                await new Promise(r => setTimeout(r, 80));
            }

            cells.forEach(cell => cell.classList.remove('spinning'));
        }

        async function showWinningLines(winningLines, coinName) {
            for (let i = 0; i < winningLines.length; i++) {
                const line = winningLines[i];

                clearCanvas();
                drawLine(line.line_positions, line.color);
                highlightWinningCells(line.line_positions);
                showLineInfo(line, coinName);

                await new Promise(r => setTimeout(r, 800));
            }

            // Clear highlights at end
            clearCanvas();
            document.querySelectorAll('.slot-cell').forEach(cell => cell.classList.remove('winner'));
            document.getElementById('line-info').style.display = 'none';
        }

        function hideOverlay() {
            const container = document.getElementById('slot-container');
            container.classList.add('hiding');
            setTimeout(() => {
                container.classList.remove('visible', 'hiding');
                currentGameData = null;
                clearCanvas();
            }, 500);
        }

        // Animate single spin with 20-line check
        async function animateSingleSpin(spinData, spinIndex, totalSpins, coinName) {
            // Update spin counter
            document.getElementById('current-spin').textContent = spinIndex + 1;
            document.getElementById('total-spins').textContent = totalSpins;

            // Spin animation
            await spinAnimation();

            // Show final grid
            const cells = document.querySelectorAll('.slot-cell');
            spinData.grid.forEach((icon, i) => {
                if (cells[i]) cells[i].innerHTML = renderIcon(icon);
            });

            await new Promise(r => setTimeout(r, 300));

            // Show winning lines for this spin
            if (spinData.winning_lines && spinData.winning_lines.length > 0) {
                await showWinningLines(spinData.winning_lines, coinName);
            }

            await new Promise(r => setTimeout(r, 200));
        }

        async function runGame(gameData, settings) {
            isAnimating = true;
            const result = gameData.result;
            const coinName = settings?.coin_name || 'Coin';

            // Check if it's freespin format (multiple spins)
            if (result.spins && Array.isArray(result.spins)) {
                const spins = result.spins;
                const totalSpins = spins.length;
                let runningTotal = 0;

                for (let i = 0; i < totalSpins; i++) {
                    await animateSingleSpin(spins[i], i, totalSpins, coinName);
                    runningTotal += spins[i].win || 0;

                    // Update running total
                    if (runningTotal > 0) {
                        document.getElementById('total-win').textContent = `+${runningTotal.toLocaleString()}`;
                        document.getElementById('coin-name').textContent = coinName;
                    }
                }

                // Show final total
                const totalWin = result.total_win || 0;
                if (totalWin > 0) {
                    document.getElementById('total-win').textContent = `+${totalWin.toLocaleString()}`;
                } else {
                    document.getElementById('total-win').textContent = '0';
                }
                document.getElementById('coin-name').textContent = coinName;

            } else {
                // Old single-spin format (backward compatibility)
                const grid = result.grid || [];
                const winningLines = result.winning_lines || [];
                const totalWin = result.total_win || 0;

                await spinAnimation();

                const cells = document.querySelectorAll('.slot-cell');
                grid.forEach((icon, i) => {
                    if (cells[i]) cells[i].innerHTML = renderIcon(icon);
                });

                await new Promise(r => setTimeout(r, 500));

                if (winningLines.length > 0) {
                    await showWinningLines(winningLines, coinName);
                }

                if (totalWin > 0) {
                    document.getElementById('total-win').textContent = `+${totalWin.toLocaleString()}`;
                } else {
                    document.getElementById('total-win').textContent = '0';
                }
                document.getElementById('coin-name').textContent = coinName;
            }

            // Hide after 2 seconds
            await new Promise(r => setTimeout(r, 2000));
            hideOverlay();
            isAnimating = false;
        }

        async function pollState() {
            try {
                const res = await fetch(`/api/channel/${channelSlug}/slot/state`);
                const data = await res.json();
                const container = document.getElementById('slot-container');

                if (data.active && data.game && !isAnimating && !currentGameData) {
                    currentGameData = data.game;

                    if (data.settings?.icons) {
                        icons = typeof data.settings.icons === 'string'
                            ? JSON.parse(data.settings.icons)
                            : data.settings.icons;
                    }

                    if (data.settings?.game_name) {
                        document.getElementById('game-title').textContent = data.settings.game_name.toUpperCase();
                    }

                    container.classList.remove('hiding');
                    container.classList.add('visible');
                    initGrid();

                    document.getElementById('player-name').textContent = `@${data.game.username}`;
                    document.getElementById('bet-amount').textContent = data.game.bet_amount.toLocaleString();
                    document.getElementById('total-win').textContent = '';
                    document.getElementById('coin-name').textContent = '';

                    if (data.game.result) {
                        runGame(data.game, data.settings);
                    }
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        initGrid();
        pollState();
        pollInterval = setInterval(pollState, 500);
    </script>
</body>

</html>
