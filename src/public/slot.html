<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        body {
            background: transparent;
            font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .slot-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 580px;
            animation: containerAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .slot-container.visible {
            display: flex;
        }

        .slot-container.hiding {
            animation: containerDisappear 0.6s ease-in forwards;
        }

        @keyframes containerAppear {
            from {
                transform: scale(0.7) translateY(50px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes containerDisappear {
            to {
                transform: scale(0.8) translateY(-30px);
                opacity: 0;
            }
        }

        /* Game Title Banner */
        .game-title-banner {
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            padding: 12px 50px;
            border-radius: 30px 30px 0 0;
            position: relative;
            z-index: 10;
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.5);
        }

        .game-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a0a00;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
        }

        /* Player Info */
        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            background: linear-gradient(180deg, #2a1a4a, #1a0a2a);
            border: 2px solid #6a3a9a;
        }

        .player-name {
            font-size: 18px;
            color: #00d9ff;
            font-weight: 600;
        }

        .bet-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bet-amount {
            background: linear-gradient(135deg, #4a2a7a, #3a1a5a);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 16px;
            color: #ffd700;
            border: 1px solid #8a5aba;
        }

        .spin-counter {
            color: #a080c0;
            font-size: 14px;
        }

        /* Slot Machine Frame */
        .slot-frame {
            background: linear-gradient(180deg, #1e0a3e, #0a0020);
            border: 4px solid #6a3a9a;
            border-top: none;
            border-radius: 0 0 20px 20px;
            padding: 15px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 0 100px rgba(106, 58, 154, 0.2);
        }

        /* Slot Grid */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 90px);
            grid-template-rows: repeat(4, 90px);
            gap: 8px;
            background: linear-gradient(180deg, #0d0020, #050010);
            padding: 15px;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        .slot-grid::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.8));
            pointer-events: none;
        }

        /* Slot Cell - Yuvarlak Kutucuk */
        .slot-cell {
            width: 90px;
            height: 90px;
            background: linear-gradient(145deg, #2a1a4a, #1a0a3a);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            border: 3px solid #4a2a7a;
            box-shadow:
                inset 0 -5px 15px rgba(0, 0, 0, 0.5),
                0 5px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.3s ease;
        }

        .slot-cell img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .slot-cell.spinning {
            animation: symbolDrop 0.15s linear infinite;
        }

        @keyframes symbolDrop {
            0% {
                transform: translateY(-10px);
                opacity: 0.7;
            }

            100% {
                transform: translateY(10px);
                opacity: 1;
            }
        }

        .slot-cell.winner {
            border-color: #ffd700;
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 215, 0, 0.4);
            animation: winPulse 0.5s ease infinite alternate;
        }

        @keyframes winPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.08);
            }
        }

        /* Falling Multiplier - Gates of Olympus Style */
        .multiplier-drop {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
            text-shadow:
                0 0 20px #ffd700,
                0 0 40px #ff8c00,
                0 4px 8px rgba(0, 0, 0, 0.8);
            animation: dropMultiplier 1s ease-out forwards;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes dropMultiplier {
            0% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }

            40% {
                transform: translateY(0) scale(1.3);
                opacity: 1;
            }

            60% {
                transform: translateY(-20px) scale(1);
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Win Display */
        .win-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 900;
            color: #ffd700;
            text-shadow:
                0 0 30px #ffd700,
                0 0 60px #ff8c00,
                0 6px 12px rgba(0, 0, 0, 0.8);
            animation: winAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
            white-space: nowrap;
        }

        @keyframes winAppear {
            from {
                transform: translate(-50%, -50%) scale(0);
            }

            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 15px;
            background: linear-gradient(180deg, #1a0a2a, #0a0015);
            border-radius: 0 0 20px 20px;
            border: 4px solid #6a3a9a;
            border-top: none;
        }

        .total-win {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .coin-name {
            color: #a080c0;
            font-size: 20px;
            margin-left: 8px;
        }
    </style>
</head>

<body>
    <div id="slot-container" class="slot-container">
        <!-- Title Banner -->
        <div class="game-title-banner">
            <div id="game-title" class="game-title">SLOT MAKİNESİ</div>
        </div>

        <!-- Player Bar -->
        <div class="player-bar">
            <span id="player-name" class="player-name">@Oyuncu</span>
            <div class="bet-info">
                <span class="bet-amount">🎫 <span id="bet-amount">0</span></span>
                <span class="spin-counter">Spin <span id="current-spin">0</span>/<span id="total-spins">5</span></span>
            </div>
        </div>

        <!-- Slot Frame -->
        <div class="slot-frame">
            <div id="slot-grid" class="slot-grid">
                <!-- 5x4 = 20 cells -->
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <span id="total-win" class="total-win"></span>
            <span id="coin-name" class="coin-name"></span>
        </div>
    </div>

    <script>
        const DEFAULT_ICONS = ['🍒', '🍋', '🔔', '⭐', '💎', '7️⃣'];
        let currentState = null;
        let pollInterval = null;
        let icons = DEFAULT_ICONS;
        let isAnimating = false;
        let lastSpinNumber = 0;

        // Get channel slug from URL
        const pathParts = window.location.pathname.split('/');
        const channelSlug = pathParts[1];

        // Check if icon is URL or emoji
        function renderIcon(icon) {
            if (icon.startsWith('http://') || icon.startsWith('https://')) {
                return `<img src="${icon}" alt="icon">`;
            }
            return icon;
        }

        // Initialize grid
        function initGrid() {
            const grid = document.getElementById('slot-grid');
            grid.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const cell = document.createElement('div');
                cell.className = 'slot-cell';
                cell.id = `cell-${i}`;
                cell.innerHTML = renderIcon(icons[Math.floor(Math.random() * icons.length)]);
                grid.appendChild(cell);
            }
        }

        // Show falling multiplier (Gates of Olympus style)
        function showFallingMultiplier(multiplier) {
            const grid = document.getElementById('slot-grid');
            const mult = document.createElement('div');
            mult.className = 'multiplier-drop';
            mult.textContent = `${multiplier}x`;

            // Random position
            const x = 50 + Math.random() * 400;
            const y = 50 + Math.random() * 250;
            mult.style.left = `${x}px`;
            mult.style.top = `${y}px`;

            grid.appendChild(mult);

            setTimeout(() => mult.remove(), 2000);
        }

        // Spin animation
        async function spinAnimation(finalResult, spinNumber, totalSpins, multiplier) {
            isAnimating = true;
            const cells = document.querySelectorAll('.slot-cell');

            // Start spinning all
            cells.forEach(cell => cell.classList.add('spinning'));

            // Spin for 1.5-2 seconds with random icons
            const spinDuration = 1500 + Math.random() * 500;
            const spinStart = Date.now();

            while (Date.now() - spinStart < spinDuration) {
                cells.forEach(cell => {
                    cell.innerHTML = renderIcon(icons[Math.floor(Math.random() * icons.length)]);
                });
                await new Promise(r => setTimeout(r, 60));
            }

            // Stop spinning and show result
            cells.forEach((cell, i) => {
                cell.classList.remove('spinning');
                if (finalResult && finalResult[i]) {
                    cell.innerHTML = renderIcon(finalResult[i]);
                }
            });

            // Update spin counter
            document.getElementById('current-spin').textContent = spinNumber;
            document.getElementById('total-spins').textContent = totalSpins;

            // Show falling multiplier if > 1
            if (multiplier > 1) {
                await new Promise(r => setTimeout(r, 300));
                showFallingMultiplier(multiplier);
            }

            isAnimating = false;
        }

        // Show total win
        function showTotalWin(amount, coinName) {
            const display = document.getElementById('total-win');
            const coinEl = document.getElementById('coin-name');
            if (amount > 0) {
                display.textContent = `+${amount.toLocaleString()}`;
                coinEl.textContent = coinName || 'Coin';
            } else {
                display.textContent = '';
                coinEl.textContent = '';
            }
        }

        // Poll for game state
        async function pollState() {
            try {
                const res = await fetch(`/api/channel/${channelSlug}/slot/state`);
                const data = await res.json();

                const container = document.getElementById('slot-container');

                if (data.active && data.game) {
                    // Update icons from settings
                    if (data.settings && data.settings.icons) {
                        icons = typeof data.settings.icons === 'string'
                            ? JSON.parse(data.settings.icons)
                            : data.settings.icons;
                    }

                    // Update title
                    if (data.settings && data.settings.game_name) {
                        document.getElementById('game-title').textContent = data.settings.game_name.toUpperCase();
                    }

                    // Show container if hidden
                    if (!container.classList.contains('visible')) {
                        container.classList.remove('hiding');
                        container.classList.add('visible');
                        initGrid();
                        lastSpinNumber = 0;
                    }

                    // Update player info
                    document.getElementById('player-name').textContent = `@${data.game.username}`;
                    document.getElementById('bet-amount').textContent = data.game.bet_amount.toLocaleString();

                    // Handle spin animation if new spin detected
                    if (data.game.current_spin > lastSpinNumber && data.game.result && !isAnimating) {
                        await spinAnimation(
                            data.game.result,
                            data.game.current_spin,
                            data.game.total_spins,
                            data.game.current_multiplier
                        );
                        lastSpinNumber = data.game.current_spin;
                    }

                    currentState = data.game;

                } else if (currentState && !data.active) {
                    // Game ended - show final result then fade out
                    if (currentState.current_multiplier > 0) {
                        const winAmount = currentState.bet_amount * currentState.current_multiplier;
                        showTotalWin(winAmount, data.settings?.coin_name);
                    }

                    // Wait a bit then hide
                    setTimeout(() => {
                        container.classList.add('hiding');
                        setTimeout(() => {
                            container.classList.remove('visible', 'hiding');
                            currentState = null;
                            lastSpinNumber = 0;
                            document.getElementById('total-win').textContent = '';
                            document.getElementById('coin-name').textContent = '';
                        }, 600);
                    }, 3000);
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        // Start polling
        initGrid();
        pollState();
        pollInterval = setInterval(pollState, 400);
    </script>
</body>

</html>
